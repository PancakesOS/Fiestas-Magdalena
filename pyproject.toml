[project]
name = "fiestas-magdalena"
version = "0.1.0"
description = "Sahuaris: ¿cuánta gente camina a Magdalena de Kino? Datos abiertos y prensa sobre la peregrinación de San Francisco Javier"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "kaleido>=1.4.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "plotly>=7.1.0",
    "requests>=2.34.2",
]

[tool.pyright]
extraPaths = ["."]

[tool.pyrefly]
search-path = ["."]
